# pro.yml
# Configuration for the generalized PROPostprocessor.

postprocessor:
  name: PROPostprocessor
  APS_mode: True

  # --- Arguments for the PROPostprocessor ---
  postprocessor_args:
    # --- PRO-specific hyperparameters (default values) ---

    # Number of gradient ascent steps to perform on the input.
    gd_steps: 5
    # Magnitude (epsilon) of the perturbation added at each step.
    noise_level: 0.001

    # --- Base Scorer Configuration ---

    # Name of the base postprocessor to which the PRO logic is applied.
    # This will be loaded dynamically. Examples: msp, temp_scaling, entropy.
    score_postprocessor: fdbd

    # --- APS Configuration ---

    # The specific score to use for optimization during the APS run.
    # Recommended to use 'score_pro_v2' as it captures instability best.
    # Options: 'score_base', 'score_pro', 'score_pro_v2'
    APS_score: score_pro_v2

  # --- Hyperparameter Search Space for PRO's own parameters ---
  # This section defines the grid of values for APS to search over.
  # The sweep for the base postprocessor (e.g., 'temperature' for temp_scaling)
  # is defined in its own YML file and will be combined automatically.
  # postprocessor_sweep:
  #   noise_level: [0.00001,0.00005,0.0001,0.0005,0.001,0.005,0.001]
  #   gd_steps: [1,2,3,5]